<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Administración | Variedades KY</title>

	<style>
		* { box-sizing: border-box; }
		body { margin: 0; font-family: Arial, sans-serif; background: #f5f3ef; color: #173B57; }
		header { background: #173B57; color: white; padding: 18px 25px; display: flex; justify-content: space-between; align-items: center; gap: 15px; }
		header h1 { margin: 0; font-size: 22px; }
		button { border: none; border-radius: 9px; padding: 10px 16px; cursor: pointer; font-weight: bold; }
		#cerrarSesion { background: #D4A84F; color: #173B57; }
		main { max-width: 1200px; margin: 30px auto; padding: 20px; }
		.top-panel { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 25px; }
		.top-panel h2 { margin: 0; }
		#agregarProducto { background: #173B57; color: white; }
		.tabla-container { background: white; border-radius: 16px; overflow-x: auto; box-shadow: 0 5px 20px rgba(0,0,0,.08); }
		table { width: 100%; border-collapse: collapse; min-width: 900px; }
		th, td { padding: 14px; border-bottom: 1px solid #eee; text-align: left; }
		th { background: #f7f3ea; }
		.estado-activo { color: green; font-weight: bold; }
		.estado-inactivo { color: #999; font-weight: bold; }
		.btn-editar { background: #D4A84F; color: #173B57; margin-right: 5px; }
		.btn-estado { background: #eee; color: #333; }
		.mensaje { padding: 30px; text-align: center; color: #777; }
		.contador { margin-top: 10px; color: #777; font-size: 14px; }
		@media (max-width: 600px) {
			header { flex-direction: column; align-items: stretch; text-align: center; }
			.top-panel { flex-direction: column; align-items: stretch; }
			#agregarProducto { width: 100%; }
		}

		/* =========================
		   MODAL PRODUCTO
		========================= */

		.modal {
			display: none;
			position: fixed;
			inset: 0;
			background: rgba(0, 0, 0, 0.55);
			z-index: 9999;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}

		.modal.activo { display: flex; }

		.modal-contenido {
			background: white;
			width: 100%;
			max-width: 650px;
			max-height: 90vh;
			overflow-y: auto;
			border-radius: 18px;
			padding: 25px;
			box-shadow: 0 15px 40px rgba(0,0,0,.25);
		}

		.modal-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 20px;
		}

		.modal-header h2 { margin: 0; }

		.btn-cerrar-modal {
			background: #eee;
			color: #333;
			font-size: 20px;
			padding: 6px 12px;
		}

		.form-grupo { margin-bottom: 15px; }

		.form-grupo label {
			display: block;
			margin-bottom: 6px;
			font-weight: bold;
		}

		.form-grupo input,
		.form-grupo textarea,
		.form-grupo select {
			width: 100%;
			padding: 11px;
			border: 1px solid #ddd;
			border-radius: 9px;
			font-size: 15px;
		}

		.form-grupo textarea {
			min-height: 100px;
			resize: vertical;
		}

		.form-fila {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 15px;
		}

		.checkbox-grupo {
			display: flex;
			align-items: center;
			gap: 10px;
			margin: 15px 0;
		}

		.checkbox-grupo input {
			width: 18px;
			height: 18px;
		}

		.btn-guardar {
			width: 100%;
			background: #173B57;
			color: white;
			padding: 13px;
			font-size: 16px;
		}

		.btn-guardar:hover { opacity: .9; }

		@media (max-width: 600px) {
			.form-fila { grid-template-columns: 1fr; }
			.modal-contenido { padding: 18px; }
		}

		#vistaPreviaImagen img {
			width: 140px;
			height: 140px;
			object-fit: contain;
			border-radius: 12px;
			border: 1px solid #ddd;
			background: #f7f3ea;
			padding: 8px;
		}

		.subiendo-imagen {
			color: #173B57;
			font-weight: bold;
			margin-top: 8px;
		}
	</style>
</head>

<body>

<header>
	<h1>VARIEDADES KY · Administración</h1>
	<button id="cerrarSesion">Cerrar sesión</button>
</header>

<main>
	<div class="top-panel">
		<div>
			<h2>Productos</h2>
			<div class="contador" id="contadorProductos">Cargando productos...</div>
		</div>
		<button id="agregarProducto">+ Agregar producto</button>
	</div>

	<div class="tabla-container">
		<table>
			<thead>
				<tr>
					<th>ID</th>
					<th>Producto</th>
					<th>Precio</th>
					<th>Oferta</th>
					<th>Categoría</th>
					<th>Stock</th>
					<th>Estado</th>
					<th>Acciones</th>
				</tr>
			</thead>
			<tbody id="tablaProductos">
				<tr><td colspan="8" class="mensaje">Cargando productos...</td></tr>
			</tbody>
		</table>
	</div>
</main>

<!-- =========================
     MODAL PRODUCTO
========================= -->

<div class="modal" id="modalProducto">

	<div class="modal-contenido">

		<div class="modal-header">
			<h2 id="tituloModal">Agregar producto</h2>
			<button type="button" class="btn-cerrar-modal" onclick="cerrarModal()">×</button>
		</div>

		<form id="formProducto">
			<input type="hidden" id="productoId">

			<div class="form-grupo">
				<label for="nombre">Nombre del producto</label>
				<input type="text" id="nombre" required>
			</div>

			<div class="form-grupo">
				<label for="descripcion">Descripción</label>
				<textarea id="descripcion" placeholder="Describe el producto..."></textarea>
			</div>

			<div class="form-fila">
				<div class="form-grupo">
					<label for="precio">Precio</label>
					<input type="number" id="precio" min="0" required>
				</div>

				<div class="form-grupo">
					<label for="precioOferta">Precio de oferta</label>
					<input type="number" id="precioOferta" min="0" placeholder="Opcional">
				</div>
			</div>

			<div class="form-fila">
				<div class="form-grupo">
					<label for="categoria">Categoría</label>
					<select id="categoria">
						<option value="cocina">Cocina</option>
						<option value="habitacion">Habitación</option>
						<option value="decoracion">Decoración</option>
						<option value="electrodomesticos">Electrodomésticos</option>
						<option value="usopersonal">Uso personal</option>
						<option value="otros">Otros</option>
					</select>
				</div>

				<div class="form-grupo">
					<label for="stock">Stock</label>
					<input type="number" id="stock" min="0" value="0" required>
				</div>
			</div>

			<div class="form-grupo">
				<label for="archivoImagen">Imagen del producto</label>
				<input type="file" id="archivoImagen" accept="image/png,image/jpeg,image/webp">
				<small style="display:block; margin-top:6px; color:#777;">PNG, JPG o WEBP</small>
				<div id="vistaPreviaImagen" style="margin-top:12px;"></div>
				<!-- Se mantiene la URL/ruta de la imagen -->
				<input type="hidden" id="imagen">
			</div>

			<div class="checkbox-grupo">
				<input type="checkbox" id="activo" checked>
				<label for="activo">Producto activo</label>
			</div>

			<button type="submit" class="btn-guardar">Guardar producto</button>
		</form>

	</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
	const SUPABASE_URL = "https://omvyifgupqppxftzpkfw.supabase.co";
	const SUPABASE_ANON_KEY = "sb_publishable_0TE2cKBynIC9YNRQx_-3-Q_nWtR0HAA";

	const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

	function escaparTexto(texto) {
		if (texto === null || texto === undefined) return "";
		return String(texto)
			.replace(/&/g, "&amp;")
			.replace(/</g, "&lt;")
			.replace(/>/g, "&gt;")
			.replace(/"/g, "&quot;")
			.replace(/'/g, "&#039;");
	}

	async function verificarSesion() {
		const { data: { user }, error } = await supabaseClient.auth.getUser();
		console.log("USUARIO ADMIN:", user);
		console.log("ERROR SESIÓN:", error);
		if (error || !user) {
			window.location.href = "admin.html";
			return;
		}
		await cargarProductos();
	}

	async function cargarProductos() {
		const tabla = document.getElementById("tablaProductos");
		const contador = document.getElementById("contadorProductos");
		tabla.innerHTML = '<tr><td colspan="8" class="mensaje">Cargando productos...</td></tr>';

		const resultado = await supabaseClient
			.from("Productos")
			.select("*")
			.order("id", { ascending: true });
		const data = resultado.data;
		const error = resultado.error;

		console.log("PRODUCTOS DEL PANEL:", data);
		console.log("ERROR DEL PANEL:", error);
		alert("Sí llegaron " + data.length + " productos");

		if (error) {
			console.error("Error cargando productos:", error);
			contador.textContent = "Error al cargar productos";
			tabla.innerHTML = '<tr><td colspan="8" class="mensaje">No se pudieron cargar los productos.</td></tr>';
			return;
		}

		if (!data || data.length === 0) {
			contador.textContent = "0 productos";
			tabla.innerHTML = '<tr><td colspan="8" class="mensaje">No hay productos registrados.</td></tr>';
			return;
		}

		contador.textContent = `${data.length} productos registrados`;

		const filas = data.map(producto => {
			const precio = "$" + Number(producto.precio || 0).toLocaleString("es-CO");
			const precioOferta = producto.precio_oferta !== null && producto.precio_oferta !== undefined && producto.precio_oferta !== ""
				? Number(producto.precio_oferta)
				: null;
			const oferta = precioOferta !== null ? "$" + precioOferta.toLocaleString("es-CO") : "-";
			const estado = producto.activo
				? '<span class="estado-activo">● Activo</span>'
				: '<span class="estado-inactivo">● Inactivo</span>';
			return `
				<tr>
					<td>${escaparTexto(producto.id)}</td>
					<td><strong>${escaparTexto(producto.nombre)}</strong></td>
					<td>${precio}</td>
					<td>${oferta}</td>
					<td>${escaparTexto(producto.categoria)}</td>
					<td>${escaparTexto(producto.stock ?? 0)}</td>
					<td>${estado}</td>
					<td>
						<button class="btn-editar" onclick="editarProducto(${producto.id})">Editar</button>
						<button class="btn-estado" onclick="cambiarEstado(${producto.id}, ${producto.activo})">
							${producto.activo ? "Desactivar" : "Activar"}
						</button>
					</td>
				</tr>`;
		}).join("");

		tabla.innerHTML = filas;

		alert("Tabla generada con " + data.length + " productos");

		console.log(
			"TABLA GENERADA CORRECTAMENTE:",
			data.length,
			"productos"
		);
	}

	async function editarProducto(id) {
		const { data, error } = await supabaseClient
			.from("Productos")
			.select("*")
			.eq("id", id)
			.single();

		if (error) {
			console.error(error);
			alert("No se pudo cargar el producto.");
			return;
		}

		document.getElementById("tituloModal").textContent = "Editar producto";
		document.getElementById("productoId").value = data.id;
		document.getElementById("nombre").value = data.nombre || "";
		document.getElementById("descripcion").value = data.descripcion || "";
		document.getElementById("precio").value = data.precio || "";
		document.getElementById("precioOferta").value = data.precio_oferta || "";
		document.getElementById("categoria").value = data.categoria || "otros";
		document.getElementById("stock").value = data.stock ?? 0;
		document.getElementById("imagen").value = data.imagen || "";
		document.getElementById("archivoImagen").value = "";
		if (data.imagen) {
			document.getElementById("vistaPreviaImagen").innerHTML = `
				<img src="${escaparTexto(data.imagen)}" alt="Imagen actual">
			`;
		} else {
			document.getElementById("vistaPreviaImagen").innerHTML = "";
		}
		document.getElementById("activo").checked = data.activo !== false;
		document.getElementById("modalProducto").classList.add("activo");
	}

	async function cambiarEstado(id, estadoActual) {
		const nuevoEstado = !estadoActual;
		const confirmar = confirm(nuevoEstado ? "¿Quieres activar este producto?" : "¿Quieres desactivar este producto?");
		if (!confirmar) return;

		const { error } = await supabaseClient
			.from("Productos")
			.update({ activo: nuevoEstado })
			.eq("id", id);
		if (error) {
			console.error("Error cambiando estado:", error);
			alert("No se pudo cambiar el estado.\n\n" + error.message);
			return;
		}
		await cargarProductos();
	}

	document.getElementById("cerrarSesion").addEventListener("click", async function() {
		await supabaseClient.auth.signOut();
		window.location.href = "admin.html";
	});

	document.getElementById("agregarProducto").addEventListener("click", function() {
		document.getElementById("tituloModal").textContent = "Agregar producto";
		document.getElementById("formProducto").reset();
		document.getElementById("vistaPreviaImagen").innerHTML = "";
		document.getElementById("imagen").value = "";
		document.getElementById("archivoImagen").value = "";
		document.getElementById("productoId").value = "";
		document.getElementById("activo").checked = true;
		document.getElementById("modalProducto").classList.add("activo");
	});

	async function subirImagen() {
		const archivoInput = document.getElementById("archivoImagen");
		const archivo = archivoInput.files[0];

		if (!archivo) {
			return null;
		}

		const tiposPermitidos = ["image/png", "image/jpeg", "image/webp"];
		if (!tiposPermitidos.includes(archivo.type)) {
			alert("Solo puedes subir imágenes PNG, JPG o WEBP.");
			return null;
		}

		const vistaPrevia = document.getElementById("vistaPreviaImagen");
		vistaPrevia.innerHTML = `
			<div class="subiendo-imagen">
				Subiendo imagen...
			</div>
		`;

		const extension = archivo.name.split(".").pop().toLowerCase();
		const nombreArchivo = "producto-" + Date.now() + "-" + Math.random().toString(36).substring(2, 8) + "." + extension;

		console.log("Intentando subir:", nombreArchivo);
		console.log("Tipo:", archivo.type);
		console.log("Tamaño:", archivo.size);

		try {
			const resultadoSubida = await supabaseClient
				.storage
				.from("Productos")
				.upload(nombreArchivo, archivo, {
					cacheControl: "3600",
					upsert: false
				});

			console.log("RESPUESTA STORAGE:", resultadoSubida.data);
			console.log("ERROR STORAGE:", resultadoSubida.error);

			if (resultadoSubida.error) {
				vistaPrevia.innerHTML = "";
				alert("ERROR AL SUBIR LA IMAGEN\n\n" + resultadoSubida.error.message);
				return null;
			}

			const resultadoUrl = supabaseClient
				.storage
				.from("Productos")
				.getPublicUrl(nombreArchivo);

			console.log("URL GENERADA:", resultadoUrl.data.publicUrl);
			document.getElementById("imagen").value = resultadoUrl.data.publicUrl;
			vistaPrevia.innerHTML = `
				<img
					src="${escaparTexto(resultadoUrl.data.publicUrl)}"
					alt="Vista previa"
					style="width:140px;height:140px;object-fit:contain;border-radius:12px;border:1px solid #ddd;padding:8px;"
				>
			`;

			return resultadoUrl.data.publicUrl;
		} catch (error) {
			console.error("ERROR INESPERADO:", error);
			vistaPrevia.innerHTML = "";
			alert("ERROR INESPERADO AL SUBIR LA IMAGEN\n\n" + error.message);
			return null;
		}
	}

	document.getElementById("archivoImagen").addEventListener("change", function() {
		const archivo = this.files[0];
		if (!archivo) return;
		const url = URL.createObjectURL(archivo);
		document.getElementById("vistaPreviaImagen").innerHTML = `
			<img src="${escaparTexto(url)}" alt="Vista previa">
		`;
	});

	async function guardarCambiosProducto(id) {
		const nombre = document.getElementById("nombre").value.trim();
		const descripcion = document.getElementById("descripcion").value.trim();
		const precio = Number(document.getElementById("precio").value);
		const precioOfertaTexto = document.getElementById("precioOferta").value;
		const categoria = document.getElementById("categoria").value.trim();
		const stock = Number(document.getElementById("stock").value);
		const imagen = document.getElementById("imagen").value.trim();

		if (!nombre) {
			alert("Escribe el nombre del producto.");
			return false;
		}

		if (Number.isNaN(precio) || precio < 0) {
			alert("El precio no es válido.");
			return false;
		}

		if (Number.isNaN(stock) || stock < 0) {
			alert("El stock no es válido.");
			return false;
		}

		const precioOferta = precioOfertaTexto !== "" ? Number(precioOfertaTexto) : null;
		if (precioOferta !== null && (Number.isNaN(precioOferta) || precioOferta < 0)) {
			alert("El precio de oferta no es válido.");
			return false;
		}

		const productoActualizado = {
			nombre,
			descripcion,
			precio,
			precio_oferta: precioOferta,
			categoria,
			imagen,
			stock
		};

		const resultado = await supabaseClient
			.from("Productos")
			.update(productoActualizado)
			.eq("id", id);

		if (resultado.error) {
			console.error("Error actualizando producto:", resultado.error);
			alert("No se pudo guardar el producto:\n" + resultado.error.message);
			return false;
		}

		alert("Producto actualizado correctamente.");
		cerrarModal();
		await cargarProductos();
		return true;
	}

	function cerrarModal() {
		document.getElementById("modalProducto").classList.remove("activo");
	}

	document.getElementById("formProducto").addEventListener("submit", async function(event) {
		event.preventDefault();

		const archivo = document.getElementById("archivoImagen").files[0];
		let nuevaImagen = document.getElementById("imagen").value;
		if (archivo) {
			const urlSubida = await subirImagen();
			if (!urlSubida) return;
			nuevaImagen = urlSubida;
		}

		const id = document.getElementById("productoId").value;
		if (id) {
			await guardarCambiosProducto(id);
			return;
		}

		const producto = {
			nombre: document.getElementById("nombre").value.trim(),
			descripcion: document.getElementById("descripcion").value.trim(),
			precio: Number(document.getElementById("precio").value),
			precio_oferta: document.getElementById("precioOferta").value
				? Number(document.getElementById("precioOferta").value)
				: null,
			categoria: document.getElementById("categoria").value,
			imagen: nuevaImagen,
			stock: Number(document.getElementById("stock").value),
			activo: document.getElementById("activo").checked
		};

		const resultado = await supabaseClient
			.from("Productos")
			.insert(producto);

		if (resultado.error) {
			console.error("ERROR COMPLETO AL GUARDAR:", resultado.error);

			alert(
				"NO SE PUDO GUARDAR EL PRODUCTO\n\n" +
				"Mensaje: " + resultado.error.message + "\n\n" +
				"Código: " + (resultado.error.code || "sin código")
			);

			return;
		}

		console.log("PRODUCTO GUARDADO CORRECTAMENTE:", resultado.data);

		alert("Producto agregado correctamente.");

		cerrarModal();
		await cargarProductos();
	});

	verificarSesion();
</script>

</body>
</html>
