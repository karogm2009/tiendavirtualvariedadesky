<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Panel | Variedades KY</title>

	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			font-family: Arial, sans-serif;
			background: #f5f3ef;
			color: #173B57;
		}

		header {
			background: #173B57;
			color: white;
			padding: 18px 25px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 15px;
		}

		header h1 {
			margin: 0;
			font-size: 22px;
		}

		#cerrarSesion {
			width: auto;
			margin: 0;
			padding: 10px 18px;
			background: #D4A84F;
			color: #173B57;
			font-weight: bold;
		}

		main {
			max-width: 1100px;
			margin: 30px auto;
			padding: 20px;
		}

		.bienvenida {
			background: white;
			padding: 25px;
			border-radius: 16px;
			box-shadow: 0 5px 20px rgba(0,0,0,.08);
		}

		.bienvenida h2 {
			margin-top: 0;
		}
	</style>
</head>

<body>

<header>

	<h1>VARIEDADES KY · Administración</h1>

	<button id="cerrarSesion">
		Cerrar sesión
	</button>

</header>

<main>

	<section class="bienvenida">

		<h2>Panel de productos</h2>

		<p>
			Aquí podrás administrar los productos de Variedades KY.
		</p>

		<p id="usuario"></p>

	</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

	const SUPABASE_URL = "https://omvyifgupqppxftzpkfw.supabase.co";
	const SUPABASE_ANON_KEY = "sb_publishable_0TE2cKBynIC9YNRQx_-3-Q_nWtR0HAA";

	const supabaseClient = window.supabase.createClient(
		SUPABASE_URL,
		SUPABASE_ANON_KEY
	);

	async function verificarAdministrador() {

		const {
			data: { user },
			error
		} = await supabaseClient.auth.getUser();

		if (error || !user) {
			window.location.href = "admin.html";
			return;
		}

		document.getElementById("usuario").textContent =
			"Sesión iniciada como: " + user.email;
	}

	document.getElementById("cerrarSesion").addEventListener(
		"click",
		async function() {

			await supabaseClient.auth.signOut();

			window.location.href = "admin.html";
		}
	);

	verificarAdministrador();

</script>

</body>
</html>
