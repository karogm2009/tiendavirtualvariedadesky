<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Administración | Variedades KY</title>

	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			font-family: Arial, sans-serif;
			background: #f5f3ef;
			color: #173B57;
		}

		.login-container {
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			padding: 20px;
		}

		.login-box {
			width: 100%;
			max-width: 420px;
			background: white;
			padding: 35px;
			border-radius: 18px;
			box-shadow: 0 10px 30px rgba(0,0,0,.12);
		}

		.logo {
			text-align: center;
			margin-bottom: 25px;
		}

		.logo h1 {
			margin: 0;
			color: #173B57;
		}

		.logo p {
			margin-top: 6px;
			color: #777;
		}

		label {
			display: block;
			margin: 15px 0 7px;
			font-weight: bold;
		}

		input {
			width: 100%;
			padding: 13px;
			border: 1px solid #ddd;
			border-radius: 10px;
			font-size: 15px;
		}

		button {
			width: 100%;
			margin-top: 22px;
			padding: 14px;
			border: none;
			border-radius: 10px;
			background: #173B57;
			color: white;
			font-size: 16px;
			cursor: pointer;
		}

		button:hover {
			opacity: .9;
		}

		#mensaje {
			margin-top: 15px;
			text-align: center;
			font-size: 14px;
		}
	</style>
</head>

<body>

<div class="login-container">

	<div class="login-box">

		<div class="logo">
			<h1>VARIEDADES KY</h1>
			<p>Panel de administración</p>
		</div>

		<form id="loginForm">

			<label for="email">Correo</label>
			<input
				type="email"
				id="email"
				placeholder="Correo de administrador"
				required
			>

			<label for="password">Contraseña</label>
			<input
				type="password"
				id="password"
				placeholder="Contraseña"
				required
			>

			<button type="submit">
				Iniciar sesión
			</button>

		</form>

		<div id="mensaje"></div>

	</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
	const SUPABASE_URL = "https://omvyifgupqppxftzpkfw.supabase.co";
	const SUPABASE_ANON_KEY = "sb_publishable_0TE2cKBynIC9YNRQx_-3-Q_nWtR0HAA";

	const supabaseClient = window.supabase.createClient(
		SUPABASE_URL,
		SUPABASE_ANON_KEY
	);

	const loginForm = document.getElementById("loginForm");
	const mensaje = document.getElementById("mensaje");

	loginForm.addEventListener("submit", async function(event) {

		event.preventDefault();

		const email = document.getElementById("email").value.trim();
		const password = document.getElementById("password").value;

		mensaje.textContent = "Iniciando sesión...";

		const { data, error } = await supabaseClient.auth.signInWithPassword({
			email: email,
			password: password
		});

		if (error) {
			console.error(error);
			mensaje.textContent = "Correo o contraseña incorrectos.";
			return;
		}

		console.log("Administrador autenticado:", data.user);

		window.location.href = "admin-panel.html";
	});
</script>

</body>
</html>
